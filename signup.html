<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>티켓팅 플랫폼 회원가입</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .container { background-color: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #666; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; } /* box-sizing 추가하여 패딩 포함 너비 계산 */
        button { width: 100%; padding: 0.7rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 1rem;}
        button:hover { background-color: #0056b3; }
        #message { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

<div class="container">
    <h2>회원가입</h2>
    <div class="form-group">
        <label for="username">아이디 (4자 이상)</label>
        <input type="text" id="username" placeholder="아이디 입력">
    </div>
    <div class="form-group">
        <label for="password">비밀번호 (8자 이상)</label>
        <input type="password" id="password" placeholder="비밀번호 입력">
    </div>
    <button onclick="signup()">가입하기</button>
    <p id="message"></p>
</div>

<script>
    async function signup() {
        // 1. 입력값 가져오기
        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const messageBox = document.getElementById('message');

        // 2. 데이터 준비 (DTO 필드명과 일치해야 함)
        const data = {
            username: usernameInput,
            password: passwordInput
        };

        try {
            // 3. fetch API로 백엔드에 POST 요청 보내기
            const response = await fetch('http://localhost:8080/api/users/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json' // JSON 형식임을 명시
                },
                body: JSON.stringify(data) // 객체를 JSON 문자열로 변환
            });

            // 4. 응답 처리
            if (response.ok) { // HTTP 상태 코드가 200~299인 경우
                const result = await response.json();
                console.log("서버 응답:", result);
                
                messageBox.className = 'success';
                messageBox.innerText = `가입 성공! 환영합니다, ${result.username}님.`;
                
                // 성공 후 입력창 초기화
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            } else {
                // 에러 처리 (400 Bad Request 등)
                // 백엔드 로그나 메시지가 있다면 여기서 확인 가능하지만, 지금은 간단히 처리
                console.error("가입 실패:", response);
                messageBox.className = 'error';
                
                if(response.status === 400) {
                    messageBox.innerText = "가입 실패: 아이디(4자 이상) 또는 비밀번호(8자 이상) 형식을 확인해주세요.";
                } else if (response.status === 500) {
                     messageBox.innerText = "가입 실패: 이미 존재하는 아이디이거나 서버 오류입니다.";
                } else {
                    messageBox.innerText = "알 수 없는 오류가 발생했습니다.";
                }
            }
        } catch (error) {
            console.error("네트워크 오류:", error);
            messageBox.className = 'error';
            messageBox.innerText = "서버에 연결할 수 없습니다. 백엔드가 켜져 있나요?";
        }
    }
</script>

</body>
</html>
