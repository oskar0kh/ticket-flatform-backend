version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ticketing_postgres # docker 컨테이너 이름

    ports:
      - "5432:5432"

    # PostgreSQL 서버 환경설정
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: ticketing_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: