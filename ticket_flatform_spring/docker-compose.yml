version: '3.8'

services:
  db:
    image: postgres:15
    container_name: ticket_flatform_postgres_container # docker 컨테이너 이름

    ports:
      - "5433:5432"

    # PostgreSQL 서버 환경설정
    environment:
      POSTGRES_USER: kunhyung
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ticket_flatform_db

    volumes:
      - postgres_volume:/var/lib/postgresql/data

volumes:
  postgres_volume: