<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>티켓팅 서비스 - 로그인</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
            outline: none;
        }
        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
        .form-toggle {
            text-align: center;
            margin-top: 1.5rem;
        }
        .form-toggle a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .form-toggle a:hover {
            text-decoration: underline;
        }
        #signup-form {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">

    <form id="login-form">
        <h2>로그인</h2>
        <div class="form-group">
            <label for="login-username">아이디</label>
            <input type="text" id="login-username" required>
        </div>
        <div class="form-group">
            <label for="login-password">비밀번호</label>
            <input type="password" id="login-password" required>
        </div>
        <button type="submit" class="submit-btn">로그인</button>
        <div class="form-toggle">
            계정이 없으신가요? <a id="show-signup">회원가입</a>
        </div>
    </form>

    <form id="signup-form">
        <h2>회원가입</h2>
        <div class="form-group">
            <label for="signup-username">아이디</label>
            <input type="text" id="signup-username" required>
        </div>
        <div class="form-group">
            <label for="signup-password">비밀번호</label>
            <input type="password" id="signup-password" required>
        </div>
        <div class="form-group">
            <label for="signup-confirm-password">비밀번호 확인</label>
            <input type="password" id="signup-confirm-password" required>
        </div>
        <button type="submit" class="submit-btn">회원가입</button>
        <div class="form-toggle">
            이미 계정이 있으신가요? <a id="show-login">로그인</a>
        </div>
    </form>

</div>

<script>
    // 폼 요소들
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');

    // 폼 전환 링크
    const showSignup = document.getElementById('show-signup');
    const showLogin = document.getElementById('show-login');

    // '회원가입' 링크 클릭 시 (폼 전환)
    showSignup.addEventListener('click', () => {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
    });

    // '로그인' 링크 클릭 시 (폼 전환)
    showLogin.addEventListener('click', () => {
        signupForm.style.display = 'none';
        loginForm.style.display = 'block';
    });

    // --- 1. 회원가입 폼 제출 (API 호출) ---
    signupForm.addEventListener('submit', async (event) => {
        event.preventDefault(); // 폼 기본 동작(새로고침) 방지

        const username = document.getElementById('signup-username').value;
        const password = document.getElementById('signup-password').value;
        const confirmPassword = document.getElementById('signup-confirm-password').value;

        // (1) 프론트엔드에서 비밀번호 확인
        if (password !== confirmPassword) {
            alert('비밀번호가 일치하지 않습니다.');
            return;
        }

        // (2) 백엔드 API로 보낼 데이터 (JSON)
        const requestBody = {
            username: username,
            password: password
        };

        // (3) fetch를 사용하여 백엔드 API 호출
        try {
            const response = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json' // 우리는 JSON을 보낸다
                },
                body: JSON.stringify(requestBody) // JS 객체를 JSON 문자열로 변환
            });

            if (response.ok) { // HTTP 200 (성공)
                alert('회원가입에 성공했습니다! 로그인을 진행해주세요.');
                // 회원가입 성공 시 로그인 폼으로 자동 전환
                signupForm.style.display = 'none';
                loginForm.style.display = 'block';
            } else { // HTTP 400 등 (실패)
                // 백엔드(AuthController)에서 보낸 에러 메시지
                const errorMessage = await response.text();
                alert(`회원가입 실패: ${errorMessage}`);
            }
        } catch (error) {
            console.error('회원가입 요청 중 오류:', error);
            alert('서버와 통신 중 오류가 발생했습니다.');
        }
    });

    // --- 2. 로그인 폼 제출 (API 호출) ---
    loginForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const username = document.getElementById('login-username').value;
        const password = document.getElementById('login-password').value;

        const requestBody = {
            username: username,
            password: password
        };

        // (주의) 이 API는 아직 백엔드에 구현하지 않았습니다!
        // (다음 단계에서 구현할 예정입니다)
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(requestBody)
            });

            if (response.ok) { // 로그인 성공 시
                const result = await response.json(); // 백엔드에서 JWT 토큰을 JSON으로 받음

                // (중요) 실제 로그인 처리는 토큰을 저장해야 함
                // localStorage.setItem('token', result.token);
                // alert('로그인 성공!');

                // (임시) 예제이므로 메인 페이지로 이동시킵니다.
                // (아직 main.html 파일이 없으므로, 생성해야 합니다)
                alert('로그인 성공! 메인 페이지로 이동합니다.');
                window.location.href = '/main.html'; // 메인 페이지로 강제 이동

            } else {
                alert('로그인 실패: 아이디 또는 비밀번호를 확인하세요.');
            }
        } catch (error) {
            console.error('로그인 요청 중 오류:', error);
            alert('서버와 통신 중 오류가 발생했습니다.');
        }
    });

</script>

</body>
</html>
